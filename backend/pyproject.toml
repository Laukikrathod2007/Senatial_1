[project]
name = "sentinel"
version = "0.1.0"
description = "Independent trust verification layer for public-sector AI systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.51",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that train shadow models (minutes). Deselect with -m 'not slow'.",
]
